<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test — V11 · 100 Verbes Usuels</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700;900&family=Source+Serif+4:ital,wght@0,300;0,400;0,600;1,400&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0e0c;--bg2:#171614;--bg3:#1e1c19;
  --gold:#c9a84c;--gold2:#e8c96a;--cream:#f0ead8;
  --muted:#7a7060;--border:#2a2820;
  --ok:#5a9e52;--ok-bg:#1a2e18;--ok-border:#3a6e34;
  --bad:#c0574a;--bad-bg:#2e1614;--bad-border:#7a3028;
}
body{background:var(--bg);color:var(--cream);font-family:'Source Serif 4',serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:32px 16px 60px}
.wrap{max-width:560px;width:100%}
.hdr{text-align:center;margin-bottom:24px}
.hdr-code{font-family:'JetBrains Mono',monospace;font-size:.7rem;color:var(--muted);letter-spacing:.12em;text-transform:uppercase;margin-bottom:6px}
.hdr-title{font-family:'Playfair Display',serif;font-size:1.7rem;font-weight:700;color:var(--gold);margin-bottom:4px}
.hdr-sub{font-size:.85rem;color:var(--muted);font-style:italic}
.back-link{display:inline-block;margin-top:12px;font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);text-decoration:none;border:1px solid var(--border);border-radius:6px;padding:5px 12px}
.back-link:hover{border-color:var(--gold);color:var(--gold)}

.card{background:var(--bg2);border:1px solid var(--border);border-radius:12px;padding:24px 20px;margin-top:8px}

/* Start screen */
.opts{display:flex;flex-direction:column;gap:10px;margin:18px 0}
.opt-row{display:flex;gap:8px}
.opt-btn{flex:1;background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:10px;font-family:'JetBrains Mono',monospace;font-size:.72rem;color:var(--cream);cursor:pointer;transition:all .15s;text-align:center}
.opt-btn.active{border-color:var(--gold);color:var(--gold2);background:rgba(201,168,76,.1)}
.opt-label{font-size:.65rem;color:var(--muted);font-family:'JetBrains Mono',monospace;text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.start-btn{width:100%;background:var(--gold);color:var(--bg);border:none;border-radius:8px;padding:13px;font-size:.88rem;font-family:'JetBrains Mono',monospace;cursor:pointer;font-weight:700;margin-top:6px;transition:opacity .15s}
.start-btn:hover{opacity:.85}

/* Quiz screen */
.progress-wrap{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.progress-bar{flex:1;height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.progress-fill{height:100%;background:var(--gold);border-radius:2px;transition:width .3s}
.progress-text{font-family:'JetBrains Mono',monospace;font-size:.68rem;color:var(--muted);white-space:nowrap}
.qnum{font-family:'JetBrains Mono',monospace;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.qword{font-family:'Playfair Display',serif;font-size:1.6rem;font-weight:700;color:var(--cream);margin-bottom:20px;text-align:center;padding:14px;background:var(--bg3);border-radius:8px}
.choices{display:flex;flex-direction:column;gap:8px}
.choice-btn{background:var(--bg3);border:1px solid var(--border);border-radius:8px;padding:12px 14px;font-size:.85rem;color:var(--cream);cursor:pointer;text-align:left;transition:all .15s;font-family:'Source Serif 4',serif}
.choice-btn:hover:not(:disabled){border-color:var(--gold)}
.choice-btn:disabled{cursor:default}
.choice-btn.correct{border-color:var(--ok-border);background:var(--ok-bg);color:var(--ok)}
.choice-btn.incorrect{border-color:var(--bad-border);background:var(--bad-bg);color:var(--bad)}
.next-wrap{margin-top:16px;text-align:center;min-height:44px}
.next-btn{background:var(--gold);color:var(--bg);border:none;border-radius:8px;padding:10px 28px;font-size:.8rem;font-family:'JetBrains Mono',monospace;cursor:pointer;font-weight:700}
.next-btn:hover{opacity:.85}

/* Result screen */
.result-score{font-family:'Playfair Display',serif;font-size:3rem;font-weight:900;color:var(--gold);text-align:center;margin:12px 0 4px}
.result-label{text-align:center;font-size:.85rem;color:var(--muted);margin-bottom:20px;font-family:'JetBrains Mono',monospace}
.result-msg{text-align:center;font-size:.95rem;color:var(--cream);margin-bottom:22px;font-style:italic}
.retry-btn{width:100%;background:transparent;border:2px solid var(--gold);border-radius:8px;padding:12px;font-size:.85rem;font-family:'JetBrains Mono',monospace;cursor:pointer;color:var(--gold);font-weight:700;letter-spacing:.03em;transition:all .2s}
.retry-btn:hover{background:var(--gold);color:var(--bg)}

.hidden{display:none !important}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="hdr-code">V11 — Test aléatoire</div>
    <div class="hdr-title">100 Verbes Usuels</div>
    <div class="hdr-sub">Teste-toi sur 100 verbes usuels</div>
  </div>

  <div class="card" id="screenStart">
    <div class="opt-label">Nombre de questions</div>
    <div class="opt-row" id="lenRow">
      <button class="opt-btn" data-n="10">10</button>
      <button class="opt-btn active" data-n="15">15</button>
      <button class="opt-btn" data-n="20">20</button>
      <button class="opt-btn" data-n="40">Max (40)</button>
    </div>
    <button class="start-btn" id="startBtn">🎲 Générer un test aléatoire</button>
  </div>

  <div class="card hidden" id="screenQuiz">
    <div class="progress-wrap">
      <div class="progress-bar"><div class="progress-fill" id="progFill" style="width:0%"></div></div>
      <div class="progress-text" id="progText">0 / 0</div>
    </div>
    <div class="qnum" id="qnum">Question 1</div>
    <div class="qword" id="qword"></div>
    <div class="choices" id="choices"></div>
    <div class="next-wrap" id="nextWrap"></div>
  </div>

  <div class="card hidden" id="screenResult">
    <div class="result-score" id="resScore">0/0</div>
    <div class="result-label">RÉSULTAT</div>
    <div class="result-msg" id="resMsg"></div>
    <button class="retry-btn" id="retryBtn">🎲 Nouveau test aléatoire</button>
  </div>
</div>

<script>
const DATA = [{"fr": "acheter", "en": "to buy"}, {"fr": "aider", "en": "to help"}, {"fr": "allumer", "en": "to turn on"}, {"fr": "apporter", "en": "to bring"}, {"fr": "boire", "en": "to drink"}, {"fr": "changer", "en": "to change"}, {"fr": "chercher", "en": "to search"}, {"fr": "couper", "en": "to cut"}, {"fr": "donner", "en": "to give"}, {"fr": "dormir", "en": "to sleep"}, {"fr": "écrire", "en": "to write"}, {"fr": "éteindre", "en": "to turn off"}, {"fr": "fermer", "en": "to close"}, {"fr": "gagner", "en": "to win"}, {"fr": "jouer", "en": "to play"}, {"fr": "laisser", "en": "to leave"}, {"fr": "laver", "en": "to clean (up)"}, {"fr": "lire", "en": "to read"}, {"fr": "manger", "en": "to eat"}, {"fr": "mettre", "en": "to put"}, {"fr": "montrer", "en": "to show"}, {"fr": "ouvrir", "en": "to open (up)"}, {"fr": "payer", "en": "to pay"}, {"fr": "perdre", "en": "to lose"}, {"fr": "porter", "en": "to wear"}, {"fr": "préparer", "en": "to prepare something"}, {"fr": "recevoir", "en": "to receive"}, {"fr": "rendre", "en": "to return something"}, {"fr": "s’endormir", "en": "to fall asleep"}, {"fr": "se réveiller", "en": "to awake"}, {"fr": "tenir", "en": "to hold"}, {"fr": "utiliser", "en": "to use"}, {"fr": "vendre", "en": "to sell"}, {"fr": "aller", "en": "to go"}, {"fr": "arriver", "en": "to arrive"}, {"fr": "conduire", "en": "to drive"}, {"fr": "courir", "en": "to run"}, {"fr": "descendre", "en": "to go down"}, {"fr": "entrer", "en": "to enter"}, {"fr": "marcher", "en": "to walk"}, {"fr": "partir", "en": "to leave"}, {"fr": "rester", "en": "to stay"}, {"fr": "retourner", "en": "to return"}, {"fr": "revenir", "en": "to come back"}, {"fr": "sortir", "en": "to get out"}, {"fr": "tomber", "en": "to fall"}, {"fr": "tourner", "en": "to turn"}, {"fr": "venir", "en": "to come"}, {"fr": "voler", "en": "to fly"}, {"fr": "apprendre", "en": "to learn"}, {"fr": "comprendre", "en": "to understand"}, {"fr": "connaître", "en": "to know"}, {"fr": "croire", "en": "to believe (in)"}, {"fr": "décider", "en": "to decide"}, {"fr": "penser", "en": "to think"}, {"fr": "reconnaître", "en": "to recognize"}, {"fr": "savoir", "en": "to know"}, {"fr": "se souvenir", "en": "to remember"}, {"fr": "trouver", "en": "to find"}, {"fr": "regarder", "en": "to watch"}, {"fr": "oublier", "en": "to forget"}, {"fr": "appeler", "en": "to call"}, {"fr": "demander", "en": "to ask for"}, {"fr": "dire", "en": "to say"}, {"fr": "écouter", "en": "to listen to"}, {"fr": "entendre", "en": "to hear"}, {"fr": "expliquer", "en": "to explain"}, {"fr": "parler", "en": "to speak"}, {"fr": "rappeler", "en": "to call back"}, {"fr": "répéter", "en": "to repeat"}, {"fr": "répondre", "en": "to answer"}, {"fr": "rencontrer", "en": "to meet"}, {"fr": "chanter", "en": "to sing"}, {"fr": "rire", "en": "to laugh"}, {"fr": "pleurer", "en": "to cry"}, {"fr": "avoir", "en": "to have"}, {"fr": "arrêter", "en": "to stop"}, {"fr": "attendre", "en": "to wait for"}, {"fr": "commencer", "en": "to begin"}, {"fr": "continuer", "en": "to continue"}, {"fr": "devenir", "en": "to become"}, {"fr": "devoir", "en": "must"}, {"fr": "essayer", "en": "to try"}, {"fr": "être", "en": "to be"}, {"fr": "faire", "en": "to do"}, {"fr": "finir", "en": "to finish"}, {"fr": "choisir", "en": "to choose"}, {"fr": "envoyer", "en": "to send"}, {"fr": "pouvoir", "en": "to be able (can)"}, {"fr": "prendre", "en": "to take"}, {"fr": "réussir", "en": "to succeed"}, {"fr": "suivre", "en": "to follow"}, {"fr": "travailler", "en": "to work"}, {"fr": "vivre", "en": "to live"}, {"fr": "vouloir", "en": "to want"}, {"fr": "ajouter", "en": "to add"}, {"fr": "accepter", "en": "to accept"}, {"fr": "aimer", "en": "to like"}, {"fr": "refuser", "en": "to refuse"}];
let qcount = 15;
let quiz = [];
let cur = 0;
let score = 0;

document.querySelectorAll('#lenRow .opt-btn').forEach(b=>{
  b.onclick = ()=>{
    document.querySelectorAll('#lenRow .opt-btn').forEach(x=>x.classList.remove('active'));
    b.classList.add('active'); qcount = parseInt(b.dataset.n);
  };
});

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}

function buildQuiz(){
  const pool = shuffle(DATA);
  quiz = pool.slice(0, Math.min(qcount, DATA.length)).map(item=>{
    const question = item.fr;
    const correct = item.en;
    const distractorPool = DATA.filter(d=>d!==item).map(d=>d.en);
    const distractors = shuffle(distractorPool).slice(0,3);
    const options = shuffle([correct, ...distractors]);
    return {question, correct, options};
  });
  cur = 0; score = 0;
}

document.getElementById('startBtn').onclick = ()=>{
  buildQuiz();
  document.getElementById('screenStart').classList.add('hidden');
  document.getElementById('screenResult').classList.add('hidden');
  document.getElementById('screenQuiz').classList.remove('hidden');
  renderQ();
};
document.getElementById('retryBtn').onclick = ()=>{
  buildQuiz();
  document.getElementById('screenResult').classList.add('hidden');
  document.getElementById('screenQuiz').classList.remove('hidden');
  renderQ();
};

function renderQ(){
  const q = quiz[cur];
  document.getElementById('progFill').style.width = ((cur)/quiz.length*100)+'%';
  document.getElementById('progText').textContent = (cur+1)+' / '+quiz.length;
  document.getElementById('qnum').textContent = 'Question '+(cur+1);
  document.getElementById('qword').textContent = q.question;
  const cWrap = document.getElementById('choices');
  cWrap.innerHTML = '';
  document.getElementById('nextWrap').innerHTML = '';
  q.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'choice-btn';
    b.textContent = opt;
    b.onclick = ()=>selectAnswer(opt);
    cWrap.appendChild(b);
  });
}

function selectAnswer(opt){
  const q = quiz[cur];
  const buttons = document.querySelectorAll('#choices .choice-btn');
  buttons.forEach(b=>{
    b.disabled = true;
    if(b.textContent === q.correct) b.classList.add('correct');
    else if(b.textContent === opt && opt !== q.correct) b.classList.add('incorrect');
  });
  if(opt === q.correct) score++;
  const nextWrap = document.getElementById('nextWrap');
  const btn = document.createElement('button');
  btn.className = 'next-btn';
  btn.textContent = (cur < quiz.length-1) ? 'Suivant →' : 'Voir le résultat';
  btn.onclick = ()=>{
    cur++;
    if(cur < quiz.length) renderQ();
    else showResult();
  };
  nextWrap.appendChild(btn);
}

function showResult(){
  document.getElementById('screenQuiz').classList.add('hidden');
  document.getElementById('screenResult').classList.remove('hidden');
  document.getElementById('resScore').textContent = score+'/'+quiz.length;
  const pct = Math.round(score/quiz.length*100);
  let msg = 'Continue à réviser, tu vas progresser !';
  if(pct>=90) msg = 'Excellent ! Maîtrise quasi parfaite.';
  else if(pct>=75) msg = 'Très bien, presque tout est acquis.';
  else if(pct>=50) msg = 'Pas mal, encore un peu de révision.';
  document.getElementById('resMsg').textContent = msg;
}
</script>
</body>
</html>
